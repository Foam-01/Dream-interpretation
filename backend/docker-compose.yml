# Local development only: a throwaway PostgreSQL on localhost:5433.
# It never points at Neon or any remote database.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dreamapp
      POSTGRES_PASSWORD: dreamapp # local-only credential
      POSTGRES_DB: dreamapp_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dreamapp-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamapp -d dreamapp_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dreamapp-pg:
